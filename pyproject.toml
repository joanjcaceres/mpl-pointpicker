[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mpl-pointpicker"
version = "0.1.0"
description = "Interactive Matplotlib point selection and image digitization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Joan Caceres", email = "contact@joancaceres.com"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.8", "PyYAML>=6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
keywords = ["matplotlib", "digitizer", "point selection", "spectroscopy"]

[project.optional-dependencies]
notebook = ["ipympl>=0.9", "ipywidgets>=8", "IPython>=8"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/joanjcaceres/mpl-pointpicker"
Issues = "https://github.com/joanjcaceres/mpl-pointpicker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
